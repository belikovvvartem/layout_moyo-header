<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header>
      <img
        src="./images/logo.png"
        alt="logo"
        class="logo"
      />
      <nav>
        <ul>
          <li>
            <input
              type="radio"
              name="menu"
              id="apple"
              checked
            />
            <label for="apple">Apple</label>
          </li>
          <li>
            <input
              type="radio"
              name="menu"
              id="samsung"
            />
            <label for="samsung">Samsung</label>
          </li>
          <li>
            <input
              type="radio"
              name="menu"
              id="smartphones"
            />
            <label for="smartphones">Smartphones</label>
          </li>
          <li>
            <input
              type="radio"
              name="menu"
              id="laptops"
            />
            <label for="laptops">Laptops & Computers</label>
          </li>
          <li>
            <input
              type="radio"
              name="menu"
              id="gadgets"
            />
            <label for="gadgets">Gadgets</label>
          </li>
          <li>
            <input
              type="radio"
              name="menu"
              id="tablets"
            />
            <label for="tablets">Tablets</label>
          </li>
          <li>
            <input
              type="radio"
              name="menu"
              id="photo"
            />
            <label for="photo">Photo</label>
          </li>
          <li>
            <input
              type="radio"
              name="menu"
              id="video"
            />
            <label for="video">Video</label>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
